app = "exchange-feeds"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  SYMBOLS = "BTCUSDT,ETHUSDT,SOLUSDT"
  LOG_LEVEL = "INFO"
  STALE_QUOTE_SECONDS = "60"
  SNAPSHOT_INTERVAL_SECONDS = "15"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
